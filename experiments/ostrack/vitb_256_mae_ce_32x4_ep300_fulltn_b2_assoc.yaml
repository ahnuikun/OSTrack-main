# B2 evaluation: frozen OSTrack plus a separately trained candidate association head.
DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN: [0.485, 0.456, 0.406]
  STD: [0.229, 0.224, 0.225]
  SEARCH: {CENTER_JITTER: 3, FACTOR: 4.0, SCALE_JITTER: 0.25, SIZE: 256, NUMBER: 1}
  TEMPLATE: {CENTER_JITTER: 0, FACTOR: 2.0, SCALE_JITTER: 0, SIZE: 128}
MODEL:
  PRETRAIN_FILE: mae_pretrain_vit_base.pth
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: CTR_POINT
  HEAD: {TYPE: CENTER, NUM_CHANNELS: 256}
TEST:
  EPOCH: 300
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  SAMURAI:
    ENABLE: True
    MODE: topk_no_kf
    TOPK: 5
    NMS_KERNEL: 3
  CANDIDATE_ASSOC:
    ENABLE: True
    CAPTURE: False
    CHECKPOINT: output/b2_candidate_assoc/b2_assoc.pt
    SHALLOW_LAYER: 2
    COMPRESSED_DIM: 128
    HIDDEN_DIM: 96
    EMBEDDING_DIM: 96
    TEMPERATURE: 0.10
